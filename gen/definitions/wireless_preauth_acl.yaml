---
name: Wireless Pre Auth ACL
rest_endpoint: /dna/intent/api/v1/wirelessSettings/preAuthAcls
get_from_all: true
id_from_query_path: response
id_from_query_path_attribute: id
put_id: true
import_no_id: true
mutex: true
skip_minimum_test: true
res_description: This resource manages wireless Pre-Auth ACLs. Pre-Auth ACLs define the traffic permitted before a client is fully authenticated, used by Guest Web-Auth (CWA/EWA) and Enterprise-Posturing SSIDs. Available in Catalyst Center 3.x.
doc_category: Wireless
test_tags: [CC32]
attributes:
  - model_name: aclListName
    type: String
    match_id: true
    mandatory: true
    description: Pre-Auth ACL List Name.
    example: PreAuth_ACL
  - model_name: aclName
    type: String
    mandatory: true
    description: Pre-Auth ACL Name.
    example: PreAuth_ACL
  - model_name: ipv6AclEnabled
    type: Bool
    default_value: false
    description: When set to true, only IPv6 ACL rules can be configured. When set to false, only IPv4 ACL rules can be configured. Default value of the attribute is false.
    example: false
  - model_name: includeAutoGeneratedRules
    type: Bool
    default_value: true
    description: If set to true, Predefined rules will be pushed, which include allowing DHCP, DNS, AAA, and other applicable ports and IPs that are created as part of the default pre-auth rule/ACE for the applicable SSID.
    example: true
  - model_name: ipAclRules
    type: List
    mandatory: true
    description: List of IPv4 or IPv6 ACL rules.
    attributes:
      - model_name: sourceAddress
        type: String
        mandatory: true
        description: An IPv4 or IPv6 source address.
        example: "250.162.252.170"
      - model_name: sourceSubnetMaskOrPrefix
        type: Int64
        mandatory: true
        description: Source subnet (IPv4) / Source prefix (IPv6). Value should be in CIDR notation.
        example: 32
      - model_name: destinationAddress
        type: String
        mandatory: true
        description: An IPv4 or IPv6 destination address.
        example: "250.162.252.171"
      - model_name: destinationSubnetMaskOrPrefix
        type: Int64
        mandatory: true
        description: Destination subnet (IPv4) / Destination prefix (IPv6). Value should be in CIDR notation.
        example: 32
      - model_name: sourcePorts
        type: String
        default_value: "0-65535"
        description: Source port. Required when protocol is TCP or UDP. Accepts a single number (e.g., 100) or a range with a hyphen and no whitespaces (e.g., 100-200). Valid values are between 0 and 65535. When not specified, Catalyst Center defaults this to the full range `0-65535`.
        example: "100"
      - model_name: destinationPorts
        type: String
        default_value: "0-65535"
        description: Destination port. Required when protocol is TCP or UDP. Accepts a single number (e.g., 100) or a range with a hyphen and no whitespaces (e.g., 100-200). Valid values are between 0 and 65535. When not specified, Catalyst Center defaults this to the full range `0-65535`.
        example: "100-200"
      - model_name: protocol
        type: String
        mandatory: true
        enum_values: [ANY, AHP, ESP, GRE, ICMP, IGMP, IP, IPINIP, NOS, OSPF, PCP, PIM, TCP, UDP, ICMPV6, IPV6, SCTP]
        description: "An IPv4 or IPv6 protocol. IPv4 values: ANY, AHP, ESP, GRE, ICMP, IGMP, IP, IPINIP, NOS, OSPF, PCP, PIM, TCP, UDP. IPv6 values: ANY, AHP, ESP, ICMPV6, IPV6, PCP, SCTP, TCP, UDP."
        example: IP
  - model_name: walledGardenUrls
    type: Set
    element_type: String
    description: Walled Garden URLs. List of URLs that are allowed for access before a client device is fully authenticated to the network. Allowed special characters are hyphen(-), underscore(_), dot(.) and asterisk(*).
    example: www.cisco.com
    exclude_test: true
