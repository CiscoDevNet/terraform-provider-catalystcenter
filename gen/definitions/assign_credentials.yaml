name: Assign Credentials
rest_endpoint: /dna/intent/api/v1/sites/%v/deviceCredentials
get_rest_endpoint: /api/v1/commonsetting/global
get_requires_id: true
put_create: true
# NOTE: The Create, Update and Delete methods are hand-maintained in
# internal/provider/resource_catalystcenter_assign_credentials.go, and the
# toBody/toBodyGlobal/updateFromBody helpers are hand-maintained in
# model_catalystcenter_assign_credentials.go (generator markers were removed).
# The Global-root full-payload retry, the inherit-vs-unset clear semantics and
# the preserve_unmanaged behaviour are documented next to that code.
put_delete: true
delete_no_id: true
delete_body: '{"cliCredentialsId":{},"snmpv2cReadCredentialsId":{},"snmpv2cWriteCredentialsId":{},"snmpv3CredentialsId":{},"httpReadCredentialsId":{},"httpWriteCredentialsId":{}}'
retry_on_error_codes:
  - NCND00010
ds_description: This data source can read the assigned credentials of a site.
res_description: This resource can manage the assigned credentials of a site.
doc_category: Network Settings
attributes:
  - model_name: siteId
    type: String
    id: true
    reference: true
    description: The site ID.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_area.test.id
  - model_name: credentialsId
    tf_name: cli_id
    data_path: cliCredentialsId
    type: String
    description: The ID of the CLI credentials used to access devices at the site.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_credentials_cli.test.id
    minimum_test_value: catalystcenter_credentials_cli.test.id
    response_data_path: 'response.#(key=\"credential.cli\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v2_read_id
    data_path: snmpv2cReadCredentialsId
    type: String
    description: The ID of the SNMPv2c Read credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v2_read\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v2_write_id
    data_path: snmpv2cWriteCredentialsId
    type: String
    description: The ID of the SNMPv2c Write credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v2_write\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v3_id
    data_path: snmpv3CredentialsId
    type: String
    description: The ID of the SNMPv3 credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v3\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: https_read_id
    data_path: httpReadCredentialsId
    type: String
    description: The ID of the HTTP(S) Read credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_credentials_https_read.test.id
    minimum_test_value: catalystcenter_credentials_https_read.test.id
    response_data_path: 'response.#(key=\"credential.http.read\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: https_write_id
    data_path: httpWriteCredentialsId
    type: String
    description: The ID of the HTTP(S) Write credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.http.write\").value.0.objReferences.0'
  # Control-only behaviour flag (Global only): not part of the deviceCredentials
  # API body. See model_catalystcenter_assign_credentials.go for how it is used.
  - model_name: preserveUnmanaged
    tf_name: preserve_unmanaged
    type: Bool
    write_only: true
    default_value: "true"
    description: >-
      When managing the Global site's credentials, preserve credential slots that are set outside Terraform instead of unsetting slots that are not present in the configuration. The Global site is the common-settings root and has no parent to inherit from, so a write must include every slot; with this enabled, unspecified slots that are currently assigned on the controller are re-sent (preserved) rather than cleared, while slots the configuration previously managed and then removed are still unset. Has no effect on non-Global sites, which inherit unspecified slots from their parent.
    exclude_test: true
    exclude_example: true
test_prerequisites: |
  data "catalystcenter_site" "test" {
    name_hierarchy = "Global"
  }
  resource "catalystcenter_area" "test" {
    name      = "Area1"
    parent_id = data.catalystcenter_site.test.id
    depends_on = [
      catalystcenter_credentials_cli.test,
      catalystcenter_credentials_https_read.test,
    ]
  }
  resource "catalystcenter_credentials_cli" "test" {
    description = "TestCli1"
    username    = "user1"
    password    = "password1"
  }
  resource "catalystcenter_credentials_https_read" "test" {
    description = "TestHttpsRead1"
    username    = "user1"
    password    = "password1"
  }