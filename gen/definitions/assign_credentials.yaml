name: Assign Credentials
rest_endpoint: /dna/intent/api/v1/sites/%v/deviceCredentials
get_rest_endpoint: /api/v1/commonsetting/global
get_requires_id: true
put_create: true
# NOTE: The Create, Update and Delete methods are hand-maintained in
# internal/provider/resource_catalystcenter_assign_credentials.go (the generator
# markers were removed).
#
# Create/Update: the Global site is the common-settings root and has no parent to
# inherit from, so it rejects a partial credential body (only some slots present)
# with NCND01090 on 2.3.7.x and NCND10603 ("site not found") on 3.2.2/3.2.3.
# After such a rejection they retry once with a complete six-slot body built by
# toBodyGlobal:
# assigned slots as {"credentialsId": "<id>"} and unspecified slots as {} ("unset"
# /none, since there is nothing to inherit at the root). Child sites accept the
# partial body directly (unspecified slots inherit from the parent), so the retry
# only triggers at Global. This mirrors the full-payload retry the Delete method
# already performs for the Global site.
#
# preserve_unmanaged (Bool, Global only): when true, the Create/Update retry does
# not blank the slots the configuration omits. It GETs the current Global
# assignment and re-sends any slot that is set on the controller but unspecified
# in the plan AND never managed by Terraform (null in prior state), so
# credentials configured outside Terraform are preserved. Slots the plan
# previously managed and then removed (non-null in prior state) are still unset
# with {}, so removals keep working. Control-only flag: it is not part of the API
# body and is ignored by toBody/toBodyGlobal/updateFromBody.
#
# Delete builds the PUT body from state and unassigns only the
# credential slots Terraform manages (non-null in state), sending a top-level
# null per slot. Per the API (documented identically on 2.3.7.9-11, 3.1.5, 3.2.2
# and 3.3.x), a null value makes the slot inherit from the parent site (which
# matches the data model: "no override here, inherit from the parent"); an empty
# object `{}` would instead mark the slot "unset"/none, and {"credentialsId":
# "<id>"} sets it. NOTE: {"credentialsId": null} is NOT the inherit form - the
# API treats it as unset - so it must not be used for clearing. Slots Terraform
# does not manage are omitted so credentials inherited from a parent site are
# preserved.
# The global site has no parent and rejects a partial body (NCND01090 on
# 2.3.7.x, NCND10603 "site not found" on 3.2.2/3.2.3); the manual
# Delete retries with a complete six-slot body built by toBodyGlobal, unsetting
# each managed slot with `{}`, which is correct at the global root since there is
# nothing to inherit. Unassigning the credentials lets the underlying credential
# objects be deleted (otherwise NCIM01100). When preserve_unmanaged is set, the
# Delete retry GETs the current global assignment and re-sends any slot that is
# set on the controller but was never managed by Terraform (null in state), so
# credentials configured outside Terraform are not wiped by the destroy; managed
# slots are still unset with `{}`. delete_body below is documentation only and is
# not used as-is while the markers are removed.
put_delete: true
delete_no_id: true
delete_body: '{"cliCredentialsId":{},"snmpv2cReadCredentialsId":{},"snmpv2cWriteCredentialsId":{},"snmpv3CredentialsId":{},"httpReadCredentialsId":{},"httpWriteCredentialsId":{}}'
retry_on_error_codes:
  - NCND00010
ds_description: This data source can read the assigned credentials of a site.
res_description: This resource can manage the assigned credentials of a site.
doc_category: Network Settings
attributes:
  - model_name: siteId
    type: String
    id: true
    reference: true
    description: The site ID.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_area.test.id
  - model_name: credentialsId
    tf_name: cli_id
    data_path: cliCredentialsId
    type: String
    description: The ID of the CLI credentials used to access devices at the site.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_credentials_cli.test.id
    minimum_test_value: catalystcenter_credentials_cli.test.id
    response_data_path: 'response.#(key=\"credential.cli\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v2_read_id
    data_path: snmpv2cReadCredentialsId
    type: String
    description: The ID of the SNMPv2c Read credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v2_read\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v2_write_id
    data_path: snmpv2cWriteCredentialsId
    type: String
    description: The ID of the SNMPv2c Write credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v2_write\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: snmp_v3_id
    data_path: snmpv3CredentialsId
    type: String
    description: The ID of the SNMPv3 credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.snmp_v3\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: https_read_id
    data_path: httpReadCredentialsId
    type: String
    description: The ID of the HTTP(S) Read credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    test_value: catalystcenter_credentials_https_read.test.id
    minimum_test_value: catalystcenter_credentials_https_read.test.id
    response_data_path: 'response.#(key=\"credential.http.read\").value.0.objReferences.0'
  - model_name: credentialsId
    tf_name: https_write_id
    data_path: httpWriteCredentialsId
    type: String
    description: The ID of the HTTP(S) Write credentials.
    example: 5e6f7b3a-2b0b-4a7d-8b1c-0d4b1cd5e1b1
    exclude_test: true
    response_data_path: 'response.#(key=\"credential.http.write\").value.0.objReferences.0'
  # Control-only flag: not part of the deviceCredentials API body. toBody /
  # toBodyGlobal / updateFromBody are hand-maintained and ignore it, so it is
  # never sent to or read back from Catalyst Center.
  - model_name: preserveUnmanaged
    tf_name: preserve_unmanaged
    type: Bool
    description: >-
      When managing the Global site's credentials, preserve credential slots that are set outside Terraform instead of unsetting slots that are not present in the configuration. The Global site is the common-settings root and has no parent to inherit from, so a write must include every slot; with this enabled, unspecified slots that are currently assigned on the controller are re-sent (preserved) rather than cleared, while slots the configuration previously managed and then removed are still unset. Has no effect on non-Global sites, which inherit unspecified slots from their parent. Defaults to `false`.
    exclude_test: true
    exclude_example: true
test_prerequisites: |
  data "catalystcenter_site" "test" {
    name_hierarchy = "Global"
  }
  resource "catalystcenter_area" "test" {
    name      = "Area1"
    parent_id = data.catalystcenter_site.test.id
    depends_on = [
      catalystcenter_credentials_cli.test,
      catalystcenter_credentials_https_read.test,
    ]
  }
  resource "catalystcenter_credentials_cli" "test" {
    description = "TestCli1"
    username    = "user1"
    password    = "password1"
  }
  resource "catalystcenter_credentials_https_read" "test" {
    description = "TestHttpsRead1"
    username    = "user1"
    password    = "password1"
  }