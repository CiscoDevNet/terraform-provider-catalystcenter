---
name: Network Devices
rest_endpoint: /dna/intent/api/v1/network-device
get_no_id: true
no_data_source: true
no_resource: true
doc_category: Inventory
test_tags: [INVENTORY]
attributes:
  - model_name: response
    tf_name: devices
    type: List
    attributes:
      - model_name: id
        type: String
        example: e0ba1a00-b69b-45aa-8c13-4cdfb59afe65
      - model_name: hostname
        type: String
        example: sw2.ciscotest.com
      - model_name: managementIpAddress
        type: String
        example: 10.10.10.1
      - model_name: managementState
        type: String
        example: Managed
      - model_name: platformId
        type: String
        example: C9KV-UADP-8P
      - model_name: serialNumber
        type: String
        description: Serial number of the network device. For devices whose hostname or management IP address is not known ahead of time (for example access points before they are claimed), this is the only stable identifier.
        example: FXS2000Q2T0
      - model_name: macAddress
        type: String
        description: MAC address of the network device. On an access point this is the base radio MAC, which is not the identifier used by the Configure Access Points intent API; use `ap_ethernet_mac_address` for that.
        example: 00:11:22:33:44:55
      - model_name: apEthernetMacAddress
        type: String
        description: Ethernet MAC address of an access point. This is the identifier the Configure Access Points intent API selects access points by; it differs from `mac_address`, which is the base radio MAC. Empty for non-access-point devices.
        example: 6c:d6:e3:5d:7d:0a
      - model_name: role
        type: String
        example: CORE
      - model_name: softwareType
        type: String
        example: IOS-XE
      - model_name: reachabilityStatus
        type: String
        description: Device reachability status as "Reachable" or "Unreachable".
        example: Reachable
      - model_name: reachabilityFailureReason
        type: String
        description: Failure reason for unreachable devices.
        example: ""
