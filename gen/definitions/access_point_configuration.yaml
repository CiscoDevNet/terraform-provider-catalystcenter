---
name: Access Point Configuration
# manual changes in Create function (composite id built from ap_list MAC addresses)
rest_endpoint: /dna/intent/api/v1/wireless/accesspoint-configuration
res_description:
  'This resource configures one or more access points using the Catalyst Center \"Configure Access Points V1\"
  intent API. Access points are selected by their ethernet MAC address.
  <p/>
  The endpoint is an asynchronous action API: each create issues a POST and waits for the resulting task to
  complete. There is no corresponding GET, so this resource cannot be read back, refreshed or imported, and
  destroying it does not revert any configuration on the access points.
  <p/>
  Every value is applied only when its matching `configure_*` flag is set to `true`. For example
  `admin_status` is ignored unless `configure_admin_status` is `true`.
  <p/>
  Note: this API does not support configuration of CleanAir or Spectrum Intelligence for IOS-XE devices
  running version 17.9 or later.'
no_data_source: true
no_read: true
no_update: true
no_delete: true
no_import: true
skip_minimum_test: true
mutex: true
doc_category: Wireless
test_tags: [WIRELESS]
attributes:
  - model_name: apList
    requires_replace: true
    type: List
    mandatory: true
    description: The list of access points to configure.
    attributes:
      - model_name: macAddress
        type: String
        mandatory: true
        description: The ethernet MAC address of the access point.
        example: 00:11:22:33:44:55
      - model_name: apName
        type: String
        description: The current host name of the access point.
        example: AP-old-name
      - model_name: apNameNew
        type: String
        description: The modified hostname of the access point.
        example: AP-new-name
  - model_name: configureAdminStatus
    requires_replace: true
    type: Bool
    description: To change the access point's admin status, set this parameter's value to `true`.
    exclude_test: true
  - model_name: adminStatus
    requires_replace: true
    type: Bool
    description: Configure the access point's admin status. Set this parameter's value to `true` to enable it and `false` to disable it.
    exclude_test: true
  - model_name: configureApMode
    requires_replace: true
    type: Bool
    description: To change the access point's mode, set this parameter's value to `true`.
    exclude_test: true
  - model_name: apMode
    requires_replace: true
    type: Int64
    enum_values: [0, 1, 4, 5]
    description: 'Configure the access point''s mode: for local/flexconnect mode, set `0`; for monitor mode, set `1`; for sniffer mode, set `4`; and for bridge/flex+bridge mode, set `5`.'
    exclude_test: true
  - model_name: configureFailoverPriority
    requires_replace: true
    type: Bool
    description: To change the access point's failover priority, set this parameter's value to `true`.
    exclude_test: true
  - model_name: failoverPriority
    requires_replace: true
    type: Int64
    enum_values: [1, 2, 3, 4]
    description: 'Configure the access point''s failover priority: for low, set `1`; for medium, set `2`; for high, set `3`; and for critical, set `4`.'
    exclude_test: true
  - model_name: configureLedStatus
    requires_replace: true
    type: Bool
    description: To change the access point's LED status, set this parameter's value to `true`.
    exclude_test: true
  - model_name: ledStatus
    requires_replace: true
    type: Bool
    description: Configure the access point's LED status. Set `true` to enable its status and `false` to disable it.
    exclude_test: true
  - model_name: configureLedBrightnessLevel
    requires_replace: true
    type: Bool
    description: To change the access point's LED brightness level, set this parameter's value to `true`.
    exclude_test: true
  - model_name: ledBrightnessLevel
    requires_replace: true
    type: Int64
    min_int: 1
    max_int: 8
    description: Configure the access point's LED brightness level by setting a value between 1 and 8.
    exclude_test: true
  - model_name: configureLocation
    requires_replace: true
    type: Bool
    description: To change the access point's location, set this parameter's value to `true`.
    exclude_test: true
  - model_name: location
    requires_replace: true
    type: String
    description: Configure the access point's location.
    exclude_test: true
  - model_name: configureHAController
    requires_replace: true
    tf_name: configure_ha_controller
    type: Bool
    description: To change the access point's HA controller, set this parameter's value to `true`.
    exclude_test: true
  - model_name: primaryControllerName
    requires_replace: true
    type: String
    description: Configure the hostname for an access point's primary controller.
    exclude_test: true
  - model_name: address
    requires_replace: true
    tf_name: primary_ip_address
    data_path: primaryIpAddress
    type: String
    description: Configure the IP address for an access point's primary controller.
    exclude_test: true
  - model_name: secondaryControllerName
    requires_replace: true
    type: String
    description: Configure the hostname for an access point's secondary controller.
    exclude_test: true
  - model_name: address
    requires_replace: true
    tf_name: secondary_ip_address
    data_path: secondaryIpAddress
    type: String
    description: Configure the IP address for an access point's secondary controller.
    exclude_test: true
  - model_name: tertiaryControllerName
    requires_replace: true
    type: String
    description: Configure the hostname for an access point's tertiary controller.
    exclude_test: true
  - model_name: address
    requires_replace: true
    tf_name: tertiary_ip_address
    data_path: tertiaryIpAddress
    type: String
    description: Configure the IP address for an access point's tertiary controller.
    exclude_test: true
  - model_name: isAssignedSiteAsLocation
    requires_replace: true
    type: Bool
    description: If the access point is assigned to a site, set this parameter's value to `true` to assign the access point location as the site name.
    exclude_test: true
  - model_name: radioConfigurations
    requires_replace: true
    type: List
    description: 'Radio parameters configuration for the selected access points. Note: the API schema marks this element as required alongside `ap_list`; some Catalyst Center versions may reject a request that omits it, in which case pass an empty list.'
    exclude_test: true
    attributes:
      - model_name: radioBand
        type: String
        enum_values: [RADIO24, RADIO5, RADIO6]
        description: 'Configure the band on the specified radio for an access point: for 2.4 GHz, set `RADIO24`; for 5 GHz, set `RADIO5`; for 6 GHz, set `RADIO6`. Any other string is invalid, including empty string.'
      - model_name: radioType
        type: Int64
        enum_values: [1, 2, 3, 6]
        description: 'Configure an access point''s radio band: for 2.4 GHz, set `1`; for 5 GHz, set `2`; for XOR, set `3`; and for 6 GHz, set `6`.'
      - model_name: configureRadioRoleAssignment
        type: Bool
        description: To change the radio role on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: radioRoleAssignment
        type: String
        enum_values: [auto, serving, monitor]
        description: Configure only one of the following roles on the specified radio for an access point as `auto`, `serving`, or `monitor`. Any other string is invalid, including empty string.
      - model_name: configureAdminStatus
        type: Bool
        description: To change the admin status on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: adminStatus
        type: Bool
        description: Configure the admin status on the specified radio for an access point. Set this parameter's value to `true` to enable it and `false` to disable it.
      - model_name: configureAntennaPatternName
        type: Bool
        description: To change the antenna gain on the specified radio for an access point, set the value for this parameter to `true`.
      - model_name: antennaPatternName
        type: String
        description: Specify the antenna name on the specified radio for an access point. The antenna name is used to calculate the gain on the radio slot.
      - model_name: antennaGain
        type: Int64
        min_int: 0
        max_int: 20
        description: Configure the antenna gain on the specified radio for an access point by setting a decimal value (in dBi). To configure `antenna_gain`, set `antenna_pattern_name` value to `other`. The External Antenna Gain value is applied in 0.5 dBi increments on the controller, therefore the value entered is multiplied by 2 to configure the absolute gain value.
      - model_name: configureAntennaCable
        type: Bool
        description: To change the antenna cable name on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: antennaCableName
        type: String
        description: Configure the antenna cable name on the specified radio for an access point. If cable loss needs to be configured, set this parameter's value to `other`.
      - model_name: cableLoss
        type: Float64
        description: Configure the cable loss on the specified radio for an access point by setting a decimal value (in dBi).
      - model_name: configureChannel
        type: Bool
        description: To change the channel on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: channelAssignmentMode
        type: Int64
        enum_values: [1, 2]
        description: 'Configure the channel assignment mode on the specified radio for an access point: for global mode, set `1`; and for custom mode, set `2`.'
      - model_name: channelNumber
        type: Int64
        description: Configure the channel number on the specified radio for an access point.
      - model_name: configureChannelWidth
        type: Bool
        description: To change the channel width on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: channelWidth
        type: Int64
        enum_values: [3, 4, 5, 6, 7]
        description: 'Configure the channel width on the specified radio for an access point: for 20 MHz, set `3`; for 40 MHz, set `4`; for 80 MHz, set `5`; for 160 MHz, set `6`; and for 320 MHz, set `7`.'
      - model_name: configurePower
        type: Bool
        description: To change the power assignment mode on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: powerAssignmentMode
        type: Int64
        enum_values: [1, 2]
        description: 'Configure the power assignment mode on the specified radio for an access point: for global mode, set `1`; and for custom mode, set `2`.'
      - model_name: powerlevel
        tf_name: power_level
        type: Int64
        min_int: 1
        max_int: 8
        description: Configure the power level on the specified radio for an access point by setting a value between 1 and 8.
      - model_name: configureCleanAirSI
        tf_name: configure_clean_air_si
        type: Bool
        description: To enable or disable either CleanAir or Spectrum Intelligence on the specified radio for an access point, set this parameter's value to `true`.
      - model_name: cleanAirSI
        tf_name: clean_air_si
        type: Int64
        enum_values: [0, 1]
        description: Configure CleanAir or Spectrum Intelligence on the specified radio for an access point. Set this parameter's value to `0` to disable the feature or `1` to enable it.
