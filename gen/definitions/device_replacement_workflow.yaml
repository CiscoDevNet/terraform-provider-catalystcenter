---
name: Device Replacement Workflow
rest_endpoint: /dna/intent/api/v1/device-replacement/workflow
no_data_source: true
no_update: true
no_delete: true
no_import: true
no_read: true
id_from_attribute: true
skip_minimum_test: true
no_wait: true
doc_category: Inventory
test_tags: [INVENTORY]
res_description:
  'This resource triggers the device replacement workflow on Catalyst Center. The faulty device must already be marked
  for replacement (see `catalystcenter_device_replacement`). The workflow is long-running; this resource only triggers it.
  <p/>
  When this resource is destroyed or refreshed, no actions are performed on Catalyst Center.'
attributes:
  - model_name: faultyDeviceId
    type: String
    mandatory: true
    requires_replace: true
    description: The ID of the faulty device. Used at apply time to read the live replacement record; the physical workflow fires only when a record exists whose faulty serial differs from replacement_device_serial_number.
    example: 12345678-1234-1234-1234-123456789012
    exclude_test: true
  - model_name: replacementDeviceSerialNumber
    type: String
    mandatory: true
    requires_replace: true
    description: Serial number of the replacement device
    example: FOC87654321
  - model_name: faultyDeviceSerialNumber
    type: String
    computed: true
    description: Serial number of the faulty device to be replaced, read from the live Catalyst Center replacement record.
    exclude_test: true
  - model_name: executed
    type: Bool
    computed: true
    no_use_state_for_unknown: true
    description: Whether the physical replacement workflow has been triggered on Catalyst Center for this instance.
    exclude_test: true
